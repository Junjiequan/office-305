<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office 305</title>
<meta name="description" content="Explore building 305 in 2D: two floors, offices, kitchens, meeting rooms and colleagues.">
<style>
  :root { --ink:#f3ecdf; --dim:#b8ad9c; --gold:#ffd36a; --panel:rgba(18,14,26,.74); --edge:rgba(255,226,170,.22); font-family:"Avenir Next","Segoe UI",system-ui,sans-serif; }
  html,body { margin:0; height:100%; background:#dfe4ea; overflow:hidden; color:var(--ink); user-select:none; -webkit-user-select:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; width:min(100vw, 177.78vh); height:min(56.25vw, 100vh); overflow:hidden; }
  #game, #dark, #vig { position:absolute; inset:0; width:100%; height:100%; }
  #game canvas { width:100% !important; height:100% !important; display:block; }
  #dark, #vig { pointer-events:none; }
  #vig { background:radial-gradient(ellipse at 50% 48%, transparent 62%, rgba(40,46,70,.14) 100%); }
  #ui { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; pointer-events:none; }
  #ui * { box-sizing:border-box; }
  .panel { background:var(--panel); border:1px solid var(--edge); border-radius:14px; backdrop-filter:blur(6px); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  #hud { position:absolute; inset:0; display:none; }
  #hero { position:absolute; left:24px; top:22px; display:flex; gap:12px; padding:10px 16px 10px 10px; align-items:center; }
  #portrait { width:64px; height:64px; border-radius:12px; background:radial-gradient(circle at 50% 35%, #4a3d66, #1a1426); border:1px solid var(--edge); }
  #bars { width:250px; }
  #floor { font-weight:700; letter-spacing:.08em; font-size:12px; text-transform:uppercase; margin-bottom:6px; color:var(--gold); }
  #hpbar { height:16px; border-radius:9px; background:#2a1620; overflow:hidden; border:1px solid rgba(255,255,255,.14); }
  #hpfill { height:100%; width:100%; background:linear-gradient(180deg,#ff8a8a,#e23a4a 55%,#b0203a); transition:width .18s; }
  #hptext { font-size:12px; color:var(--dim); margin-top:3px; letter-spacing:.04em; display:flex; justify-content:space-between; }
  #loot { position:absolute; left:24px; top:116px; display:flex; gap:16px; padding:7px 14px; font-weight:700; font-size:15px; }
  #loot span { display:flex; align-items:center; gap:7px; } .dot { width:13px; height:13px; border-radius:50%; display:inline-block; }
  #mini { position:absolute; right:24px; top:22px; padding:6px; } #minicv { width:200px; height:140px; display:block; border-radius:8px; background:rgba(0,0,0,.35); }
  #boss { position:absolute; left:50%; top:20px; width:560px; transform:translateX(-50%); display:none; text-align:center; }
  #bossname { font-weight:800; letter-spacing:.24em; text-transform:uppercase; font-size:13px; text-shadow:0 2px 6px #000; }
  #bossbar { height:14px; border-radius:8px; background:#1b1220; border:1px solid rgba(255,255,255,.2); overflow:hidden; margin-top:5px; }
  #bossfill { height:100%; width:100%; background:linear-gradient(180deg,#d98aff,#8a3ae0 60%,#5a1fa8); transition:width .15s; }
  #abil { position:absolute; left:50%; bottom:24px; transform:translateX(-50%); display:flex; gap:16px; align-items:center; padding:10px 20px; }
  #abilicon { position:relative; width:52px; height:52px; border-radius:50%; background:#2a2140; border:2px solid var(--gold); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:24px; }
  #abilcd { position:absolute; inset:0; background:conic-gradient(rgba(0,0,0,.72) var(--cd,0deg), transparent 0); }
  #abiltext { font-size:13px; line-height:1.35; max-width:300px; } #abiltext b { color:var(--gold); letter-spacing:.06em; text-transform:uppercase; } #keys { color:var(--dim); font-size:11px; }
  #prompt { position:absolute; left:50%; bottom:112px; transform:translateX(-50%); padding:8px 18px; font-weight:700; letter-spacing:.1em; display:none; }
  #toast { position:absolute; left:50%; top:128px; transform:translateX(-50%); font-weight:800; font-size:30px; letter-spacing:.16em; text-transform:uppercase; text-shadow:0 3px 16px rgba(0,0,0,.85); opacity:0; transition:opacity .35s; white-space:nowrap; text-align:center; }
  #toast small { display:block; font-size:13px; letter-spacing:.3em; color:var(--dim); margin-top:6px; }

  #loc { position:absolute; left:24px; top:22px; padding:12px 20px 12px 16px; min-width:230px; }
  #loc small { display:block; color:var(--dim); letter-spacing:.22em; text-transform:uppercase; font-size:10px; }
  #locname { font-size:22px; font-weight:800; letter-spacing:.03em; margin-top:3px; } #locfloor { color:var(--gold); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin-top:2px; }
  #hint { position:absolute; left:24px; bottom:20px; color:rgba(243,236,223,.7); font-size:12px; letter-spacing:.04em; line-height:1.9; text-shadow:0 1px 4px #000; }
  #dialog { position:absolute; left:50%; bottom:30px; transform:translateX(-50%); width:640px; padding:16px 22px 14px; display:none; pointer-events:auto; }
  #dlgname { font-weight:800; letter-spacing:.12em; text-transform:uppercase; font-size:13px; color:var(--gold); } #dlgname span { color:var(--dim); font-weight:500; letter-spacing:.08em; margin-left:8px; }
  #dlgtext { font-size:18px; line-height:1.5; margin-top:6px; min-height:54px; } #dlgnext { text-align:right; color:var(--dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:radial-gradient(ellipse at 50% 40%, rgba(40,28,64,.78), rgba(6,4,12,.96)); pointer-events:auto; z-index:5; }
  .overlay.show { display:flex; }
  h1 { font-size:68px; letter-spacing:.14em; margin:0; text-transform:uppercase; background:linear-gradient(180deg,#fff1c8,#ffbd5a 55%,#d9742a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 6px 18px rgba(255,150,50,.35)); }
  .sub { color:var(--dim); letter-spacing:.32em; text-transform:uppercase; font-size:14px; margin:8px 0 22px; }
  .cards { display:flex; gap:20px; margin:8px 0 26px; }
  .card { width:224px; padding:14px 14px 16px; border-radius:18px; background:linear-gradient(180deg,rgba(60,46,92,.7),rgba(24,18,38,.82)); border:1px solid var(--edge); cursor:pointer; text-align:center; transition:transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover, .card.sel { transform:translateY(-6px); border-color:var(--gold); box-shadow:0 16px 40px rgba(255,170,60,.22); }
  .card canvas { width:128px; height:128px; } .card h3 { margin:.1em 0 .1em; letter-spacing:.14em; text-transform:uppercase; font-size:18px; }
  .card p { margin:.4em 0 .6em; font-size:12px; color:var(--dim); line-height:1.45; min-height:52px; }
  .stat { display:flex; justify-content:space-between; font-size:12px; margin-top:4px; color:var(--dim); } .stat b { color:var(--ink); font-weight:600; }
  .btn { pointer-events:auto; cursor:pointer; padding:13px 38px; border-radius:30px; font-weight:800; letter-spacing:.22em; text-transform:uppercase; color:#2a1606; background:linear-gradient(180deg,#ffe08a,#ffb13d); border:0; box-shadow:0 8px 26px rgba(255,160,40,.4); font-size:15px; font-family:inherit; margin:0 6px; }
  .btn.alt { background:linear-gradient(180deg,#e9e3f5,#b9aedc); box-shadow:0 8px 26px rgba(170,150,255,.3); }
  .btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .hint { color:var(--dim); font-size:12px; margin-top:20px; letter-spacing:.05em; text-align:center; line-height:1.7; }
  kbd { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:1px 7px; font-family:inherit; font-size:11px; }
  #perkcards { display:flex; gap:20px; margin-top:20px; }
  .perk { width:228px; padding:22px 16px; border-radius:18px; background:linear-gradient(180deg,rgba(70,54,104,.82),rgba(26,20,42,.92)); border:1px solid var(--edge); cursor:pointer; text-align:center; transition:transform .15s,border-color .15s; }
  .perk:hover { transform:translateY(-8px); border-color:var(--gold); }
  .perk .ic { font-size:44px; } .perk h4 { margin:.5em 0 .3em; letter-spacing:.12em; text-transform:uppercase; font-size:16px; color:var(--gold); } .perk p { margin:0; font-size:13px; color:var(--dim); line-height:1.5; }
  .big { font-size:46px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; margin:0; } .stats { margin:18px 0 26px; font-size:16px; line-height:1.9; color:var(--dim); text-align:center; } .stats b { color:var(--ink); }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#07060c; z-index:9; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); font-size:13px; }
  #bar { width:240px; height:4px; background:#1c1626; border-radius:2px; margin-top:14px; overflow:hidden; } #barfill { height:100%; width:0; background:var(--gold); transition:width .15s; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="stage"><div id="wrap">
  <div id="game"></div>
  <canvas id="dark" width="1280" height="720"></canvas>
  <div id="vig"></div>
  <div id="loading"><div>Opening the office</div><div id="bar"><div id="barfill"></div></div></div>
</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
